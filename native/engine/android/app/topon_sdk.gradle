repositories {
    flatDir {
        dirs 'libs'
    }
    //Anythink(Core)
    maven {
        url "https://jfrog.anythinktech.com/artifactory/overseas_sdk"
    }
    // Debugger UI
    maven {
        url "https://jfrog.anythinktech.com/artifactory/debugger"
    }

}
dependencies {
    api fileTree(include: ['*.jar','*.aar'], dir: 'libs')

    //Anythink (Necessary)
    api "com.anythink.sdk:core-tpn:6.6.22"

    //Androidx (Necessary)
    api "androidx.appcompat:appcompat:1.6.1"
    api "androidx.browser:browser:1.4.0"

    //Anythink Adx SDK(Necessary)
    api "com.anythink.sdk:adapter-tpn-sdm:6.5.75.1.2"
    api "com.smartdigimkttech.sdk:smartdigimkttech-sdk:6.5.75"

    //Tramini
    api "com.anythink.sdk:tramini-plugin-tpn:6.6.22"

    // Debugger UI Tools
    implementation 'com.anythink.sdk:debugger-ui-tpn:1.1.5'

    //Ad Networks
    api "com.anythink.sdk:adapter-tpn-bigo:6.5.40"
    api "com.anythink.sdk:adapter-tpn-admob:25.4.0.1.1"
    api "com.google.android.gms:play-services-ads:25.4.0"
}
